name: Import source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[import-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        run: |
          set -x
          curl -fL --connect-timeout 20 --max-time 120 --retry 2 -o /tmp/paofu-source.zip https://aka.doubaocdn.com/s/K7d4wQVMC5
      - name: Unzip source
        run: |
          set -x
          rm -rf /tmp/paofu-source
          mkdir -p /tmp/paofu-source
          unzip -q /tmp/paofu-source.zip -d /tmp/paofu-source
          rm -rf /tmp/paofu-source/.github/workflows
      - name: Fix repository references
        run: |
          set -x
          sed -i 's#Renly1994/xiaotang-daozai#Wangsiqi510/paofu#g' README.md Cargo.toml
      - name: Commit source
        run: |
          set -x
          cp -a /tmp/paofu-source/. ./
          sed -i 's#Renly1994/xiaotang-daozai#Wangsiqi510/paofu#g' README.md Cargo.toml
          git config user.name "Wangsiqi510"
          git config user.email "1831900786@qq.com"
          git add -A
          git commit -m "导入泡浮源码并改成自己的仓库" || echo "no changes"
          git push
