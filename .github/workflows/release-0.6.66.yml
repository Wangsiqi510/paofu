name: Publish 0.6.66

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-0.6.66]')
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        run: |
          curl -fL --retry 3 -o Daozai-v0.6.66-windows-x64.zip https://aka.doubaocdn.com/s/MuldB97uj2
      - name: Verify checksum
        run: |
          echo "26fa160ba53b1ad56ada915c8449111ca46be13fbc3f07fadf269e8a18064cd4  Daozai-v0.6.66-windows-x64.zip" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.6.66 Daozai-v0.6.66-windows-x64.zip \
            --title "泡浮 v0.6.66" \
            --notes "泡浮 0.6.66：关于页新增软件更新入口，更新弹窗改为「立即更新」，支持 zip 内 泡浮.exe。"
