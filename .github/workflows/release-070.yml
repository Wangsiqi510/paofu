name: Publish Paofu 0.7.0

on:
  push:
    paths:
      - '.github/workflows/release-070.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download package
        run: |
          set -e
          curl -L --fail --retry 3 -o Paofu-v0.7.0-windows-x64.zip "https://aka.doubaocdn.com/s/qPdQ6NxOUy"
          cp Paofu-v0.7.0-windows-x64.zip Daozai-v0.7.0-windows-x64.zip
          ls -lh Paofu-v0.7.0-windows-x64.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.7.0 \
            Paofu-v0.7.0-windows-x64.zip \
            Daozai-v0.7.0-windows-x64.zip \
            --title "泡浮 v0.7.0" \
            --latest \
            --notes "泡浮 0.7.0 正式版。\n\n这是基于原 Daozai 项目的 MIT 衍生发行版，已完成品牌、包名、安装器、数据目录与更新源的全面改名。\n\n- 新数据目录：%APPDATA%\\Paofu（首次启动自动迁移旧目录）\n- 新更新源：github.com/Wangsiqi510/paofu\n- 安装包/免安装包统一为 Paofu 命名\n\n旧版 0.6.66 用户请先手动下载本包覆盖一次，之后即可在应用内检查更新。"
